name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS ships bash 3.2, Linux ships bash 5 — the scripts must run on both.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run.sh
