<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="Two renderings of the cc-token-statusline badge: an everyday one and one where a quota window is tight">
  <title>cc-token-statusline badge</title>

  <!-- Its own dark ground, so the image reads the same in a light or dark README. -->
  <rect width="900" height="176" rx="10" fill="#1b1b1f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">

    <text x="24" y="34" font-size="11" fill="#6c6c72">everyday</text>
    <text x="24" y="60" fill="#8a8a8a">
      <tspan fill="#5a5a60">[</tspan><tspan fill="#5faf5f">token 93k/1M 9%</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#8a8a8a">cota </tspan><tspan fill="#5faf5f">5h 34%</tspan><tspan fill="#5a5a60"> │ </tspan><tspan fill="#5faf5f">7d 12%</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#8a8a8a">gasto ↑2.4M ↓33k</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#5faf5f">cache 99%</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#5faf5f">+230</tspan><tspan fill="#5a5a60">/</tspan><tspan fill="#d75f5f">-14</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#8a8a8a">api 1m12s</tspan><tspan fill="#5a5a60">]</tspan>
    </text>

    <text x="24" y="114" font-size="11" fill="#6c6c72">context filling up, weekly quota getting tight</text>
    <text x="24" y="140" fill="#8a8a8a">
      <tspan fill="#5a5a60">[</tspan><tspan fill="#d7af5f">token 780k/1M 78%</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#8a8a8a">cota </tspan><tspan fill="#5faf5f">5h 41%</tspan><tspan fill="#5a5a60"> │ </tspan><tspan fill="#d7af5f">7d 82% ~2h11m</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#8a8a8a">gasto ↑9.7M ↓88k</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#d7af5f">cache 71%</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#5faf5f">+230</tspan><tspan fill="#5a5a60">/</tspan><tspan fill="#d75f5f">-14</tspan><tspan fill="#5a5a60"> · </tspan><tspan fill="#8a8a8a">api 4m03s</tspan><tspan fill="#5a5a60">]</tspan>
    </text>

  </g>
</svg>
